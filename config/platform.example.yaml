project:
  name: llm-augmented-sast
  data_boundary: local-development

scanner:
  semgrep_config: auto
  gitleaks_config: config/gitleaks.example.toml

triage:
  confidence_thresholds:
    auto_suppress_fp: 0.95
    high_confidence_tp: 0.85
  never_auto_suppress:
    - critical
    - high

risk_scoring:
  weights:
    severity: 0.25
    reachability: 0.25
    exposure: 0.20
    data_sensitivity: 0.20
    exploitability: 0.10


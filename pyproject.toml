[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sast-triage"
version = "0.1.0"
description = "LLM-Augmented SAST Triage & Logic Bug Detection Platform"
readme = "README.md"
requires-python = ">=3.11, <3.15"
dependencies = [
    # Modal SDK is required by the built-in `--provider real` Qwen3-14B adapter.
    # The standard library cannot authenticate, package, or invoke Modal GPU functions.
    "modal>=1.5.3,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    # Joern's query server requires HTTP and WebSocket clients. The standard
    # library does not provide a WebSocket implementation.
    "requests>=2.32.0,<3.0.0",
    "websockets>=15.0,<18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff",
]

[project.scripts]
sast-triage = "sast_triage.entrypoint:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src"]

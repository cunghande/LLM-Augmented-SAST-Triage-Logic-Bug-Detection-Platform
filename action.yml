name: 'LLM-Augmented SAST Triage'
description: 'Scan Python repository with Semgrep & Gitleaks and perform LLM-assisted vulnerability triage with hash-based caching'
author: 'SAST Triage Team'
inputs:
  repository:
    description: 'Path to target Python repository'
    required: false
    default: '.'
  output-dir:
    description: 'Output directory for reports'
    required: false
    default: './sast-triage-output'
  provider:
    description: 'Triage provider (fake, ollama, real)'
    required: false
    default: 'fake'
  cache:
    description: 'Enable decision caching'
    required: false
    default: 'true'
  cache-dir:
    description: 'Directory for decision cache'
    required: false
    default: '.sast_triage_cache'
  logic-detector:
    description: 'Logic bug detector (off, python-idor-business-logic)'
    required: false
    default: 'off'
  post-summary:
    description: 'Post report summary to GitHub Step Summary'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Restore Decision Cache
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ inputs.cache-dir }}
        key: sast-triage-cache-${{ runner.os }}-${{ hashFiles('**/*.py') }}
        restore-keys: |
          sast-triage-cache-${{ runner.os }}-

    - name: Install Tools & Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install semgrep
        if ! command -v gitleaks &> /dev/null; then
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks || true
        fi
        pip install .

    - name: Run SAST Triage
      shell: bash
      run: |
        ARGS=(
          scan-and-triage
          --repository "${{ inputs.repository }}"
          --output-dir "${{ inputs.output-dir }}"
          --provider "${{ inputs.provider }}"
        )
        if [ "${{ inputs.cache }}" = "true" ]; then
          ARGS+=(--cache-dir "${{ inputs.cache-dir }}")
        fi
        if [ "${{ inputs.logic-detector }}" != "off" ]; then
          ARGS+=(--logic-detector "${{ inputs.logic-detector }}")
        fi
        sast-triage "${ARGS[@]}"

    - name: Publish Step Summary
      if: inputs.post-summary == 'true'
      shell: bash
      run: |
        if [ -f "${{ inputs.output-dir }}/report.md" ]; then
          cat "${{ inputs.output-dir }}/report.md" >> "$GITHUB_STEP_SUMMARY"
        fi

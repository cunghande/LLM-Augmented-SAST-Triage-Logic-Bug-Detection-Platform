name: SAST Triage Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  sast-triage:
    name: Run SAST & LLM Triage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache Decision DB
        uses: actions/cache@v4
        with:
          path: .sast_triage_cache
          key: sast-triage-decision-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            sast-triage-decision-cache-${{ runner.os }}-

      - name: Install Scanners & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          # Install Gitleaks binary
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          pip install .

      - name: Run SAST Triage Pipeline
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          mkdir -p output
          sast-triage scan-and-triage \
            --repository . \
            --output-dir output \
            --provider fake \
            --cache \
            --cache-dir .sast_triage_cache \
            --logic-detector python-idor-business-logic

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-triage-reports
          path: |
            output/report.json
            output/report.html
          retention-days: 14
